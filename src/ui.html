<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOTO Quorum</title>
<style>
  :root { --red:#b42318; --green:#067647; --blue:#175cd3; --grey:#667085; --line:#d0d5dd; }
  * { box-sizing: border-box; }
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0; background: #f2f4f7; color: #101828; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .banner { padding: 22px 16px; border-radius: 12px; text-align: center; font-size: 24px; font-weight: 800; color: #fff; }
  .banner.LOCKED_OUT { background: var(--red); } .banner.CLEARED { background: var(--green); } .banner.RESTARTED { background: var(--blue); }
  .banner small { display: block; font-size: 14px; font-weight: 500; opacity: .9; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
  .lock { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eaecf0; }
  .lock:last-child { border: 0; }
  .tag { padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; color: #fff; }
  .tag.AWAITING { background: var(--grey); } .tag.LOCKED { background: var(--red); } .tag.RELEASED { background: var(--green); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 14px 18px; color: #fff; background: var(--blue); cursor: pointer; }
  button.big { width: 100%; font-size: 20px; padding: 20px; } button.red { background: var(--red); } button.grey { background: var(--grey); }
  button.small { padding: 6px 10px; font-size: 13px; }
  input, textarea { font: inherit; width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; margin: 4px 0 10px; }
  label { font-weight: 600; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eaecf0; vertical-align: top; }
  .ok { color: var(--green); font-weight: 700; } .bad { color: var(--red); font-weight: 700; }
  #msg { padding: 10px 14px; border-radius: 10px; margin: 12px 0; display: none; word-break: break-all; }
  #msg.show { display: block; } #msg.good { background: #ecfdf3; color: var(--green); } #msg.err { background: #fef3f2; color: var(--red); }
  .muted { color: var(--grey); font-size: 13px; } .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  code { word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>🔒 LOTO Quorum <span class="muted">digital layer on top of physical locks</span></h1>
  <div id="msg"></div>
  <div id="app"></div>
</main>
<script>
const ctx = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const app = document.getElementById("app"), msg = document.getElementById("msg");
const draft = { to: "" };
let last = "";

const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...kids.flat().filter(k => k != null && k !== false));
  return e;
};
const show = (...nodes) => app.replaceChildren(...nodes.filter(Boolean));
const flash = (text, bad) => { msg.textContent = text; msg.className = "show " + (bad ? "err" : "good"); };
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({}));
  return { ok: r.ok, data };
};
const link = (frag) => location.origin + "/#" + new URLSearchParams(frag);
const when = (t) => t ? new Date(t).toLocaleTimeString() : "";

/* ---------- open a lockout ---------- */
function renderOpen() {
  const f = {
    machine: h("input", { value: "Press Line 4" }), supervisor: h("input", { value: "Supervisor" }),
    roster: h("textarea", { rows: "4" }, "Asha\nBen\nChen"), escalate: h("input", { type: "number", min: "10", placeholder: "e.g. 30 (demo)" }),
    code: h("input", { placeholder: "only if the site set one" }),
  };
  app.replaceChildren(h("div", { class: "card" },
    h("h2", {}, "Open a lockout"),
    h("label", {}, "Machine"), f.machine, h("label", {}, "Supervisor"), f.supervisor,
    h("label", {}, "Workers who must each lock (one per line)"), f.roster,
    h("label", {}, "Escalate to supervisor after N seconds (optional, default 15 min / 4 h)"), f.escalate,
    h("label", {}, "Site code"), f.code,
    h("button", { class: "big red", onclick: async () => {
      const body = { machine: f.machine.value, supervisor: f.supervisor.value, siteCode: f.code.value,
                     roster: f.roster.value.split("\n").map(s => s.trim()).filter(Boolean) };
      if (f.escalate.value) { body.lockWaitSeconds = body.stuckSeconds = Number(f.escalate.value); }
      const r = await api("/jobs", body);
      if (!r.ok) return flash(r.data.error || "could not open the lockout", true);
      renderLinks(r.data);
    } }, "⛔ Lock out machine")));
}
function renderLinks(d) {
  flash("Lockout opened. Send each worker their personal link. Keys are shown once.");
  app.replaceChildren(
    h("div", { class: "card" }, h("h2", {}, "Supervisor board"), h("a", { href: link({ job: d.jobId, sup: d.supervisorKey }) }, "Open the supervisor board")),
    h("div", { class: "card" }, h("h2", {}, "Worker links"),
      d.workers.map(w => h("p", {}, h("b", {}, w.name), h("br"), h("a", { href: link({ job: d.jobId, slot: w.slot, key: w.key }) }, link({ job: d.jobId, slot: w.slot, key: w.key }))))),
    h("div", { class: "card" }, h("h2", {}, "Read-only board (no keys)"), h("a", { href: link({ job: d.jobId }) }, link({ job: d.jobId }))));
}

/* ---------- board ---------- */
async function act(body, okText) {
  const r = await api(`/jobs/${ctx.job}/act`, body);
  flash(r.ok ? okText(r.data) : r.data.error, !r.ok);
  last = ""; refresh();
}
async function restart() {
  const r = await api(`/jobs/${ctx.job}/restart`, { key: ctx.sup });
  if (r.ok) flash(`Restart authorized. Audit sealed in S3: ${r.data.sealKey}`);
  else flash(r.data.error + (r.data.blocking && r.data.blocking.length ? ` — blocked by: ${r.data.blocking.join(", ")}` : ""), true);
  last = ""; refresh();
}
function override(slot, name) {
  const reason = prompt(`Written reason for force-releasing ${name}'s lock (min 10 characters):`);
  if (!reason) return;
  if (!confirm(`I verified that ${name} is NOT inside the machine.`)) return;
  act({ action: "override", slot, key: ctx.sup, reason, confirmNotInside: true }, () => `Lock force-released for ${name}.`);
}
const BANNER = {
  LOCKED_OUT: ["⛔ LOCKED OUT: DO NOT START", "Every lock must come off first"],
  CLEARED: ["✅ CLEARED FOR RESTART", "All locks released and re-verified"],
  RESTARTED: ["🟢 RESTART AUTHORIZED", "Audit sealed"],
};
function render(d) {
  const me = d.locks.find(l => l.slot === ctx.slot);
  const worker = ctx.slot && ctx.key && me && d.status === "LOCKED_OUT" && h("div", { class: "card" },
    h("h2", {}, `Hello ${me.holder}`),
    me.state === "AWAITING" && h("button", { class: "big red", onclick: () => act({ action: "lock", slot: ctx.slot, key: ctx.key }, () => "Your lock is ON.") }, "🔒 Apply my lock"),
    me.state === "LOCKED" && h("div", {},
      h("button", { class: "big", onclick: () => act({ action: "release", slot: ctx.slot, key: ctx.key }, () => "Your lock is OFF.") }, "🔓 Release my lock (I am out)"),
      h("p", { class: "muted" }, "Shift change? Hand the lock over. It never comes off in between."),
      h("input", { placeholder: "Incoming worker name", value: draft.to, oninput: (e) => { draft.to = e.target.value; } }),
      h("button", { class: "grey", onclick: () => act({ action: "handover", slot: ctx.slot, key: ctx.key, to: draft.to },
        (r) => `Handed over to ${r.holder}. Give them this link: ${link({ job: ctx.job, slot: r.slot, key: r.key })}`) }, "🔁 Hand over")),
    me.state === "RELEASED" && h("p", { class: "ok" }, "Your lock is released. Thank you."));

  const sup = ctx.sup && h("div", { class: "card" }, h("h2", {}, "Supervisor"),
    h("button", { class: "big", onclick: restart }, "▶ Request restart"),
    h("p", { class: "muted" }, "Refused while any lock is on. A refusal is recorded in the audit trail."));

  const [title, sub] = BANNER[d.status];
  show(
    h("div", { class: "banner " + d.status }, title, h("small", {}, `${d.machine} · ${sub}`)),
    worker, sup,
    h("div", { class: "card" }, h("h2", {}, `Locks (${d.locks.filter(l => l.state === "RELEASED").length}/${d.locks.length} released)`),
      d.locks.map(l => h("div", { class: "lock" },
        h("div", {}, h("b", {}, l.holder), h("div", { class: "muted" }, l.state === "LOCKED" ? `locked ${when(l.lockedAt)}` : l.state === "RELEASED" ? `released ${when(l.releasedAt)} by ${l.releasedBy}` : "waiting to lock")),
        h("div", { class: "row" }, h("span", { class: "tag " + l.state }, l.state),
          ctx.sup && d.status === "LOCKED_OUT" && l.state !== "RELEASED" && h("button", { class: "small grey", onclick: () => override(l.slot, l.holder) }, "Override"))))),
    h("div", { class: "card" },
      h("h2", {}, "Audit trail ", h("span", { class: d.chain.ok ? "ok" : "bad" }, d.chain.ok ? `🔗 hash chain verified (${d.chain.length} events)` : `⚠ chain BROKEN: ${d.chain.detail}`)),
      d.sealKey && h("p", { class: "ok" }, "Sealed in S3 with Object Lock: ", h("code", {}, d.sealKey)),
      h("table", {}, h("tr", {}, ["#", "Time", "Event", "Detail"].map(x => h("th", {}, x))),
        d.events.slice().reverse().map(e => h("tr", {}, h("td", {}, String(e.seq)), h("td", {}, when(e.ts)), h("td", {}, e.type), h("td", {}, e.detail))))),
    h("p", { class: "muted" }, "Supplements physical locks and the written energy-control procedure. It never replaces them."));
}
async function refresh() {
  const r = await api(`/jobs/${ctx.job}`);
  if (!r.ok) return show(h("p", { class: "bad" }, r.data.error || "job not found"));
  const s = JSON.stringify(r.data);
  if (s !== last) { last = s; render(r.data); }
}

if (!ctx.job) renderOpen();
else { refresh(); setInterval(refresh, 3000); }
addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
